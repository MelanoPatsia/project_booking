{% extends base_template %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-sm p-5 text-center border-0 rounded-4 success-card">

        <h2 class="success-title">
            {{ title }}
        </h2>

        <p class="success-message">
            {{ message }}
        </p>

        <a href="{{ redirect_url }}"
           class="btn btn-success mt-3 success-button">
            {{ button_text }}
        </a>

    </div>

</div>

{% endblock %}
