{% extends "base.html" %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center"
     style="min-height:70vh;">

    <div class="text-center p-4 p-md-5"
         style="
         background:white;
         border-radius:20px;
         box-shadow:0px 4px 25px rgba(0,0,0,0.12);
         max-width:450px;
         width:100%;
         ">

        <div style="
            width:70px;
            height:70px;
            margin:0 auto 20px auto;
            border-radius:50%;
            background:#DFF5E8;
            color:#1F7A4D;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:34px;
            font-weight:bold;
        ">
            ✓
        </div>

        <h1 style="color:#1F3A2A; font-size:28px; margin-bottom:15px;">
            {{ title }}
        </h1>

        <p style="color:#4F6B5A; margin-bottom:30px;">
            {{ message }}
        </p>

        <a href="{{ redirect_url }}"
           class="btn"
           style="
           background-color:#1F3A2A;
           color:white;
           padding:12px 24px;
           border-radius:12px;
           font-weight:600;
           ">
            {{ button_text }}
        </a>

    </div>

</div>

{% endblock %}
