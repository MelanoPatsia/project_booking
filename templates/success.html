{% extends base_template %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-sm p-5 text-center border-0 rounded-4">

        <h2 style="color:#1F3A2A; font-weight:bold;">
            {{ title }}
        </h2>

        <p style="color:#4F6B5A; margin-top:15px; font-size:18px;">
            {{ message }}
        </p>

        <a href="{{ redirect_url }}"
           class="btn btn-success mt-3"
           style="background:#1F3A2A; border:none; padding:10px 20px; border-radius:10px;">
            {{ button_text }}
        </a>

    </div>

</div>

{% endblock %}
