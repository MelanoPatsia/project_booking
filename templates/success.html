{% extends "base.html" %}

{% block content %}

<div style="
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
">

    <div style="
        background:white;
        padding:40px;
        border-radius:20px;
        box-shadow:0px 4px 25px rgba(0,0,0,0.12);
        text-align:center;
        max-width:450px;
    ">

        <div style="
            font-size:60px;
            margin-bottom:20px;
            color:#1F3A2A;
        ">
            ✓
        </div>

        <h1 style="
            color:#1F3A2A;
            font-size:30px;
            margin-bottom:15px;
        ">
            {{ title }}
        </h1>

        <p style="
            color:#4F6B5A;
            margin-bottom:30px;
        ">
            {{ message }}
        </p>

        <a href="{{ redirect_url }}"
           style="
           background-color:#1F3A2A;
           color:white;
           padding:12px 24px;
           border-radius:12px;
           text-decoration:none;
           font-weight:600;
           ">

            {{ button_text }}

        </a>

    </div>

</div>

{% endblock %}
