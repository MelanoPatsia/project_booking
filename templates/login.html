<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body class="login-body">

<div class="login-card">

    <h2 class="login-title">
        Admin Login
    </h2>

    <form method="POST">

        <div class="mb-3">

            <label>
                Email
            </label>

            <input type="email"
                   name="email"
                   class="form-control login-input"
                   required>

        </div>


        <div class="mb-3">

            <label>
                Password
            </label>

            <input type="password"
                   name="password"
                   class="form-control login-input"
                   required>

        </div>


        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

</div>

</body>
</html>
