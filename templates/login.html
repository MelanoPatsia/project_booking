<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1F3A2A, #2D523C);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0px 10px 40px rgba(0,0,0,0.25);
        }

        .login-title {
            text-align: center;
            font-weight: bold;
            color: #1F3A2A;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-login {
            width: 100%;
            background: #1F3A2A;
            color: white;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #2D523C;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h2 class="login-title">Admin Login</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

</div>

</body>
</html>
