{% extends "admin_base.html" %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="new-project-card">

        <h2 class="new-project-title">
            ახალი პროექტის დამატება
        </h2>

        <p class="new-project-intro">
            გააზიარე შესაძლებლობა სხვებისთვის — დაამატე შენი პროექტი Gzaari.ge-ზე.
        </p>

        <form action="/new_project" method="POST">

            <!-- Project Title -->
            <div class="mb-4">

                <label class="form-label new-project-label">
                    პროექტის დასახელება
                </label>

                <input type="text"
                       class="form-control new-project-input"
                       name="title"
                       required>

            </div>


            <!-- Short Description -->
            <div class="mb-4">

                <label class="form-label new-project-label">
                    პროექტის მოკლე აღწერა
                </label>

                <textarea class="form-control new-project-input"
                          name="description"
                          rows="4"
                          maxlength="150"
                          required></textarea>

                <small class="new-project-help">
                    მაქსიმუმ 150 სიმბოლო. ეს ტექსტი გამოჩნდება პროექტის ბარათზე.
                </small>

            </div>


            <!-- Full Description -->
            <div class="mb-4">

                <label class="form-label new-project-label">
                    სრული აღწერა
                </label>

                <textarea class="form-control new-project-input new-project-textarea"
                          name="full_description"
                          rows="8"
                          required></textarea>

                <small class="new-project-help">
                    ეს ტექსტი გამოჩნდება პროექტის სრულ გვერდზე.
                </small>

            </div>


            <!-- Additional Information -->
            <div class="mb-4">

                <label class="form-label new-project-label">
                    დამატებითი ინფორმაცია
                </label>

                <textarea class="form-control new-project-input new-project-textarea"
                          name="additional_info"
                          rows="5"
                          placeholder="მაგ:
რეგისტრაციის ბმული:
https://example.com

ტელეფონი:
+995 555 123 456"></textarea>

            </div>


            <!-- Image Link -->
            <div class="mb-4">

                <label class="form-label new-project-label">
                    პროექტის სურათის ლინკი
                </label>

                <input type="url"
                       class="form-control new-project-input"
                       name="image_link"
                       required>

            </div>


            <!-- Project Status -->
            <div class="mb-4">

                <label class="form-label d-block new-project-label status-label">
                    პროექტის სტატუსი
                </label>

                <div class="project-status-options">

                    <div class="project-status-option">

                        <input type="radio"
                               name="project_status"
                               value="open"
                               checked>

                        <label>
                            ყოველთვის ღია
                        </label>

                    </div>


                    <div class="project-status-option">

                        <input type="radio"
                               name="project_status"
                               value="limited">

                        <label>
                            დრო შეზღუდულია
                        </label>

                    </div>

                </div>

            </div>


            <!-- Submit -->
            <button type="submit" class="new-project-submit">
                პროექტის დამატება
            </button>

        </form>

    </div>

</div>

{% endblock %}
