{% extends "base.html" %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="p-5"
         style="
         background-color: #F4F8F5;
         border-radius: 20px;
         box-shadow: 0px 4px 20px rgba(0,0,0,0.08);
         max-width: 850px;
         margin: auto;
         ">

        <h2 style="
            color: #1F3A2A;
            font-weight: bold;
            margin-bottom: 10px;
        ">
            ახალი პროექტის დამატება
        </h2>

        <p style="
            color: #4F6B5A;
            margin-bottom: 35px;
        ">
            გააზიარე შესაძლებლობა სხვებისთვის — დაამატე შენი პროექტი Gzaari.ge-ზე.
        </p>

        <form action="/new_project" method="POST">

            <div class="mb-4">
                <label class="form-label"
                       style="color:#1F3A2A; font-weight:600;">
                    პროექტის დასახელება
                </label>

                <input type="text"
                       class="form-control"
                       name="title"
                       required

                       style="
                       border-radius: 12px;
                       padding: 12px;
                       border: 1px solid #B7D6C0;
                       ">
            </div>


            <div class="mb-4">
                <label class="form-label"
                       style="color:#1F3A2A; font-weight:600;">
                    პროექტის მოკლე აღწერა
                </label>

                <textarea class="form-control"
                          name="description"
                          rows="4"
                          maxlength="150"
                          required

                          style="
                          border-radius: 12px;
                          padding: 12px;
                          border: 1px solid #B7D6C0;
                          resize: none;
                          "></textarea>

                <small style="color:#4F6B5A;">
                    მაქსიმუმ 150 სიმბოლო. ეს ტექსტი გამოჩნდება პროექტის ბარათზე.
                </small>
            </div>


            <div class="mb-4">
                <label class="form-label"
                       style="color:#1F3A2A; font-weight:600;">
                    პროექტის სურათის ლინკი
                </label>

                <input type="text"
                       class="form-control"
                       name="link"
                       required

                       style="
                       border-radius: 12px;
                       padding: 12px;
                       border: 1px solid #B7D6C0;
                       ">
            </div>


            <div class="mb-4">

                <label class="form-label d-block"
                       style="
                       color:#1F3A2A;
                       font-weight:600;
                       margin-bottom:15px;
                       ">
                    პროექტის სტატუსი
                </label>

                <div style="
                    display:flex;
                    gap:15px;
                    flex-wrap:wrap;
                ">

                    <div style="
                        background-color:white;
                        border:1px solid #B7D6C0;
                        border-radius:12px;
                        padding:12px 18px;
                    ">

                        <input type="radio"
                               name="project_status"
                               value="open"
                               checked>

                        <label style="margin-left:6px;">
                            ყოველთვის ღია
                        </label>

                    </div>


                    <div style="
                        background-color:white;
                        border:1px solid #B7D6C0;
                        border-radius:12px;
                        padding:12px 18px;
                    ">

                        <input type="radio"
                               name="project_status"
                               value="limited">

                        <label style="margin-left:6px;">
                            დრო შეზღუდულია
                        </label>

                    </div>

                </div>

            </div>


            <button type="submit"

                    style="
                    background-color:#1F3A2A;
                    color:white;
                    border:none;
                    padding:12px 28px;
                    border-radius:12px;
                    font-weight:600;
                    transition:0.3s;
                    ">

                პროექტის დამატება

            </button>

        </form>

    </div>

</div>

{% endblock %}
