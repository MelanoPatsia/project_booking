{% extends "admin_base.html" %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="edit-project-card">

        <h2 class="edit-project-title">
            პროექტის რედაქტირება
        </h2>

        <form method="POST">

            <div class="mb-4">
                <label class="edit-label">
                    სათაური
                </label>

                <input class="form-control edit-input"
                       name="title"
                       value="{{ project.title }}">
            </div>


            <div class="mb-4">
                <label class="edit-label">
                    მოკლე აღწერა
                </label>

                <textarea class="form-control edit-input"
                          name="short_description"
                          rows="3">{{ project.short_description }}</textarea>
            </div>


            <div class="mb-4">
                <label class="edit-label">
                    სრული აღწერა
                </label>

                <textarea class="form-control edit-input"
                          name="full_description"
                          rows="7">{{ project.full_description }}</textarea>
            </div>


            <div class="mb-4">
                <label class="edit-label">
                    დამატებითი ინფორმაცია
                </label>

                <textarea class="form-control edit-input"
                          name="additional_info"
                          rows="5">{{ project.additional_info }}</textarea>

                <small class="edit-help">
                    ბმული, ტელეფონი, სოციალური ქსელი ან სხვა დეტალები.
                </small>
            </div>


            <div class="mb-4">
                <label class="edit-label">
                    სურათის ლინკი
                </label>

                <input class="form-control edit-input"
                       name="image_link"
                       value="{{ project.image_link }}">
            </div>


            <div class="mb-4">

                <label class="edit-label">
                    სტატუსი
                </label>

                <select class="form-control edit-input"
                        name="project_status">

                    <option value="open"
                    {% if project.project_status == 'open' %}selected{% endif %}>
                        ყოველთვის ღია
                    </option>

                    <option value="limited"
                    {% if project.project_status == 'limited' %}selected{% endif %}>
                        დრო შეზღუდულია
                    </option>

                </select>

            </div>


            <div class="d-flex gap-3">

                <button type="submit"
                        class="edit-save-btn">
                    შენახვა
                </button>


                <a href="{{ url_for('admin_projects') }}"
                   class="edit-cancel-btn">
                    გაუქმება
                </a>

            </div>


        </form>

    </div>

</div>

{% endblock %}
