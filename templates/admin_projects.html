{% extends "admin_base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg border-0 rounded-4 admin-card">

        <div class="card-body p-4">

            <div class="admin-header">

                <h2 class="admin-title">
                    პროექტები
                </h2>

                <div class="admin-filters">

                    <input type="radio"
                           class="btn-check"
                           name="projectFilter"
                           id="openProjects"
                           autocomplete="off"
                           checked>

                    <label class="btn btn-filter" for="openProjects">
                        ყოველთვის ღია
                    </label>

                    <input type="radio"
                           class="btn-check"
                           name="projectFilter"
                           id="limitedProjects"
                           autocomplete="off">

                    <label class="btn btn-filter" for="limitedProjects">
                        შეზღუდული
                    </label>

                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle admin-table">

                    <thead class="admin-table-head">
                        <tr>
                            <th>ID</th>
                            <th>სათაური</th>
                            <th>მოკლე აღწერა</th>
                            <th>რედაქტირება</th>
                            <th>წაშლა</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for project in projects %}

                        <tr class="project-row"
                            data-status="{{ project.project_status }}">

                            <td>{{ project.id }}</td>

                            <td>{{ project.title }}</td>

                            <td>{{ project.short_description }}</td>

                            <td>
                                <a href="{{ url_for('edit_project', project_id=project.id) }}"
                                   class="btn btn-edit btn-sm">
                                    <i class="bi bi-pencil-square"></i>
                                    რედაქტირება
                                </a>
                            </td>

                            <td>
                                <form method="POST"
                                      action="{{ url_for('delete_project', project_id=project.id) }}"
                                      onsubmit="return confirmDelete(this)">

                                    <button type="submit"
                                            class="btn btn-delete btn-sm delete-btn">
                                        <i class="bi bi-trash"></i>
                                        წაშლა
                                    </button>

                                </form>
                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>
    const openRadio = document.getElementById('openProjects');
    const limitedRadio = document.getElementById('limitedProjects');
    const rows = document.querySelectorAll('.project-row');

    function filterProjects() {

        rows.forEach(row => {

            const status = row.dataset.status;

            if (openRadio.checked) {
                row.style.display = status === 'open' ? '' : 'none';
            }

            if (limitedRadio.checked) {
                row.style.display = status === 'limited' ? '' : 'none';
            }

        });

    }

    openRadio.addEventListener('change', filterProjects);
    limitedRadio.addEventListener('change', filterProjects);

    filterProjects();
</script>

<script>
function confirmDelete(form) {

    const btn = form.querySelector(".delete-btn");

    if (btn.disabled) return false;

    const confirmed = confirm("დარწმუნებული ხარ რომ გინდა წაშლა?");

    if (!confirmed) return false;

    btn.disabled = true;
    btn.innerText = "იშლება...";

    return true;
}
</script>

{% endblock %}
