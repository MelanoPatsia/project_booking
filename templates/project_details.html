{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div style="
        max-width: 1000px;
        margin: auto;
        background: white;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0px 6px 25px rgba(0,0,0,0.08);
    ">

        <img src="{{ project['link'] }}"
             alt="Project Image"
             style="
             width: 100%;
             height: 450px;
             object-fit: cover;
             display: block;
             ">

        <div style="padding: 40px;">

            {% if project['project_status'] == 'open' %}

                <span style="
                    background-color:#DFF5E8;
                    color:#1F7A4D;
                    padding:8px 16px;
                    border-radius:999px;
                    font-weight:600;
                    font-size:14px;
                ">
                    ყოველთვის ღია
                </span>

            {% else %}

                <span style="
                    background-color:#FFF1D6;
                    color:#B26A00;
                    padding:8px 16px;
                    border-radius:999px;
                    font-weight:600;
                    font-size:14px;
                ">
                    დრო შეზღუდულია
                </span>

            {% endif %}

            <h1 style="
                color:#1F3A2A;
                font-weight:700;
                margin-top:25px;
                margin-bottom:20px;
            ">
                {{ project['title'] }}
            </h1>

            <hr>

            <h4 style="
                color:#1F3A2A;
                margin-top:30px;
                margin-bottom:15px;
            ">
                პროექტის აღწერა
            </h4>

            <p style="
                color:#4F6B5A;
                line-height:1.9;
                font-size:17px;
            ">
                {{ project['full_description'] }}
            </p>

            <div style="margin-top:40px;">

                <a href="/current-projects"
                   style="
                   background-color:#1F3A2A;
                   color:white;
                   text-decoration:none;
                   padding:12px 24px;
                   border-radius:12px;
                   font-weight:600;
                   ">
                    ← პროექტების გვერდზე გადასვლა
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
