{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div style="
        max-width: 1000px;
        margin: auto;
        background: white;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0px 6px 25px rgba(0,0,0,0.08);
    ">

        <div style="width:100%; height:450px; background:#f2f2f2;">

            <img src="{{ project['image_link'] }}"
                 alt="Project Image"
                 style="
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    object-position: center;
                    display: block;
                 ">

        </div>

        <div class="p-4 p-md-5">

            {% if project['project_status'] == 'open' %}

                <span style="
                    background-color:#DFF5E8;
                    color:#1F7A4D;
                    padding:8px 16px;
                    border-radius:999px;
                    font-weight:600;
                    font-size:14px;
                    display:inline-block;
                ">
                    ყოველთვის ღია
                </span>

            {% else %}

                <span style="
                    background-color:#FFF1D6;
                    color:#B26A00;
                    padding:8px 16px;
                    border-radius:999px;
                    font-weight:600;
                    font-size:14px;
                    display:inline-block;
                ">
                    დრო შეზღუდულია
                </span>

            {% endif %}

            <h1 style="
                color:#1F3A2A;
                font-weight:700;
                margin-top:25px;
                margin-bottom:20px;
            ">
                {{ project['title'] }}
            </h1>

            <hr>

            <h4 style="color:#1F3A2A;">
                პროექტის აღწერა
            </h4>

            <p style="
                color:#4F6B5A;
                line-height:1.9;
                font-size:17px;
            ">
                {{ project['full_description'] }}
            </p>

            <div style="margin-top:40px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">

                <a href="/current-projects"
                   style="
                   background-color:#1F3A2A;
                   color:white;
                   padding:12px 24px;
                   border-radius:12px;
                   font-weight:600;
                   min-width:220px;
                   text-align:center;
                   text-decoration:none;
                   ">
                    ← პროექტების გვერდზე
                </a>

                <a href="/"
                   style="
                   background-color:#2D523C;
                   color:white;
                   padding:12px 24px;
                   border-radius:12px;
                   font-weight:600;
                   min-width:220px;
                   text-align:center;
                   text-decoration:none;
                   ">
                    ← მთავარი გვერდი
                </a>

            </div>

        </div>
    </div>

</div>

{% endblock %}
